services:
  omo:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: omo

    stdin_open: true
    tty: true

    volumes:
      - omo-workspace:/workspace
      - omo-home:/root

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      DOCKER_MODEL_RUNNER_URL: http://model-runner.docker.internal

    networks:
      - omo-network

volumes:
  omo-workspace:
  omo-home:

networks:
  omo-network:
    driver: bridge